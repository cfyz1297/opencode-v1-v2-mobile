name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      reuse_apk_run_id:
        description: 'Optional successful build run to reuse; application sources must match exactly'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node >= 23.6 runs the TypeScript test files natively (type-stripping),
          # matching the local toolchain. No build step or extra deps required.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check release version metadata
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and HTTP integration tests with coverage gates
        run: npm run test:coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        if: inputs.reuse_apk_run_id == ''
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        if: inputs.reuse_apk_run_id == ''
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        if: inputs.reuse_apk_run_id == ''
        run: npx expo prebuild --platform android --no-install

      - name: Setup signing
        if: inputs.reuse_apk_run_id == ''
        # Fork: sign EVERY build (not just tag refs) with the persistent
        # keystore from repo secrets, so updates install over previous
        # versions. A debug keystore generated fresh per run changes signature
        # every build and Android refuses to update over an installed app.
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing: production keystore"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing: debug keystore (keystore secret not set)"
          fi

      - name: Build APK
        if: inputs.reuse_apk_run_id == ''
        working-directory: android
        # The NDK is not part of the Gradle cache, so every run downloads it
        # from dl.google.com; that download fails every so often with
        # "Archive is not a ZIP archive" and fails the whole build before any
        # code is compiled. One retry is enough to ride that out; a real
        # compile error fails both attempts.
        run: ./gradlew assembleRelease || ./gradlew assembleRelease

      - name: Verify reused build has identical application sources
        if: inputs.reuse_apk_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_apk_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" --jq .head_sha)
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN/jobs" --jq '.jobs[] | select(.name == "build") | .conclusion' | grep -qx success
          git diff --exit-code "$SOURCE_SHA" HEAD -- app src android assets package.json package-lock.json app.json metro.config.js tsconfig.json
          echo "Reusing signed APK from $SOURCE_SHA: application sources are identical."

      - name: Download verified existing APK
        if: inputs.reuse_apk_run_id != ''
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_apk_run_id }}
          name: app-release
          path: android/app/build/outputs/apk/release

      - name: Verify package, version and update signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/full-apk.txt
          sed -n '1p' /tmp/full-apk.txt > /tmp/current-apk.txt
          cat /tmp/current-apk.txt
          EXPECTED_VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          EXPECTED_VERSION_NAME=$(node -p "require('./app.json').expo.version")
          grep -q "name='cc.agentlabs.opencode'" /tmp/current-apk.txt
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" /tmp/current-apk.txt
          grep -q "versionName='$EXPECTED_VERSION_NAME'" /tmp/current-apk.txt
          # The release must not be debuggable and must not carry the dev-menu
          # draw-over-apps permission. app.json blocks SYSTEM_ALERT_WINDOW at
          # prebuild time; this asserts the *assembled* APK, not the config.
          if grep -q "application-debuggable" /tmp/full-apk.txt; then
            echo "release APK is debuggable"; exit 1
          fi
          "$AAPT" dump permissions "$APK" > /tmp/permissions.txt
          cat /tmp/permissions.txt
          if grep -q "SYSTEM_ALERT_WINDOW" /tmp/permissions.txt; then
            echo "SYSTEM_ALERT_WINDOW is present in the release APK"; exit 1
          fi
          # Voice input needs the runtime permission to be declared at all;
          # without it requestPermissionsAsync can only answer "denied". An
          # image-picker `microphonePermission: false` silently removed it.
          if ! grep -q "RECORD_AUDIO" /tmp/permissions.txt; then
            echo "RECORD_AUDIO is missing from the release APK: voice input cannot work"; exit 1
          fi
          # The keep-alive foreground service is the only reason notifications
          # reach a locked phone; without the permission Android 14+ refuses to
          # start it, and missing the plugin would silently drop the service.
          if ! grep -q "FOREGROUND_SERVICE_DATA_SYNC" /tmp/permissions.txt; then
            echo "FOREGROUND_SERVICE_DATA_SYNC is missing: notifications die in the background"; exit 1
          fi
          if ! "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "KeepAliveService"; then
            echo "KeepAliveService is missing from the release APK"; exit 1
          fi
          "$SIGNER" verify --print-certs "$APK" > /tmp/current-signers.txt
          cat /tmp/current-signers.txt
          # Production certificate fingerprint. Hardcoded on purpose: downloading
          # the previous release APK (~86 MB) on every build only to compare an
          # immutable value wasted minutes. Update this if the keystore changes.
          EXPECTED_CERT=0b409f5f6c2ce47a84b7f4ded0403a82a99470f668d6a924d0a09c4ab7821686
          CURRENT_CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/current-signers.txt | sort -u | tr 'A-F' 'a-f')
          test -n "$CURRENT_CERT"
          test "$CURRENT_CERT" = "$EXPECTED_CERT"
          echo 'Package/version verified; signing certificate matches the published app.'

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  roadmap-smoke:
    name: Android roadmap CUA smoke
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v7
        with:
          name: app-release
          path: artifacts/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifacts/apk/app-release.apk
            node scripts/cua-roadmap-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roadmap-smoke-evidence
          path: artifacts/roadmap

